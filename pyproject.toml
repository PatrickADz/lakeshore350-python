[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeshore350-python"
version = "1.2.0"
description = "Python driver for the Lake Shore Model 350 Temperature Controller (TCP/IP)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "PatrickADz", email = "PatrickADz@users.noreply.github.com" }
]
keywords = ["lakeshore", "instrumentation", "cryogenics", "radio-astronomy", "lab-automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/PatrickADz/lakeshore350-python"

[tool.setuptools.packages.find]
where = ["src"]

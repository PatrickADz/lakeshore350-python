# Example configuration for the Lake Shore 350.
#
# Priority order: command-line arguments > config.ini > built-in defaults.

[instrument]
ip = 192.168.1.100
port = 7777
timeout = 5

[acquisition]
# K or C
unit = K
# seconds between samples
sample_period = 1.0
channels = A,B,C,D

[channel_names]
A = Sensor A
B = Sensor B
C = Sensor C
D = Sensor D

[output]
# folder where CSV/PNG files are saved
output_dir = ./data
plot = true
# CSV logging - on by default, independent of plot
save = true
